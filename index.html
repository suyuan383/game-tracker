<!-- 启动画面控制 -->
<script>
(function(){
  const splash = document.getElementById('splash-screen');
  if (!splash) return;

  const img = splash.querySelector('img');
  const startTime = Date.now();
  const MIN_SHOW = 1500;

  // 关键：用 JS 给容器和图片设置真实高度
  function fitScreen(){
    const h = window.innerHeight;
    const w = window.innerWidth;
    splash.style.width  = w + 'px';
    splash.style.height = h + 'px';
    splash.style.top    = '0px';
    splash.style.left   = '0px';
  }

  fitScreen();
  window.addEventListener('resize', fitScreen);
  window.addEventListener('orientationchange', () => setTimeout(fitScreen, 100));

  // 锁住页面滚动
  document.body.style.overflow = 'hidden';

  function hide(){
    const elapsed = Date.now() - startTime;
    const wait = Math.max(0, MIN_SHOW - elapsed);
    setTimeout(() => {
      splash.classList.add('hide');
      setTimeout(() => {
        splash.remove();
        document.body.style.overflow = '';
      }, 600);
    }, wait);
  }

  if (img && img.complete) {
    hide();
  } else if (img) {
    img.addEventListener('load', hide);
    img.addEventListener('error', hide);
  } else {
    hide();
  }
})();
</script>
</body>
</html>
